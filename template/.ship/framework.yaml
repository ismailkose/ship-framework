{
  "managed_by": "Ship Framework",
  "schema_version": 1,
  "canonical_context_file": "CLAUDE.md",
  "shared_memory_files": [
    "TASKS.md",
    "DECISIONS.md",
    "CONTEXT.md",
    "LEARNINGS.md"
  ],
  "runtimes": {
    "claude": {
      "label": "Claude / Cowork",
      "adapter": "CLAUDE.md",
      "supports_literal_commands": true
    },
    "codex": {
      "label": "Codex",
      "adapter": "AGENTS.md",
      "supports_literal_commands": false
    }
  },
  "policies": {
    "reference_gate": {
      "enabled": true,
      "mode": "on_demand"
    },
    "shared_context_switching": {
      "enabled": true,
      "guidance": "If a user switches between Claude and Codex mid-project, continue from the same shared context instead of re-planning from scratch."
    }
  },
  "workflows": [
    {
      "id": "think",
      "command_name": "/shipmate think",
      "runtime_label": "Idea validation workflow",
      "purpose": "Clarify consequential uncertainty about the idea — ask only what isn't already known.",
      "lead_roles": [
        "Vi"
      ],
      "input_files": [
        "CLAUDE.md",
        "DECISIONS.md",
        "CONTEXT.md",
        "LEARNINGS.md"
      ],
      "output_files": [
        "DECISIONS.md"
      ],
      "status_values": [
        "VALIDATED",
        "PIVOT_SUGGESTED",
        "PAUSE"
      ],
      "handoff_text": "`VALIDATED` — the idea is clear; the brief is in DECISIONS.md.\\n`PIVOT_SUGGESTED` — offer the tighter framing; think again only if the founder wants to.\\n`PAUSE` — not ready: name the missing evidence and how to get it.",
      "next": [
        "design",
        "plan"
      ],
      "next_note": "plan directly when a design system exists"
    },
    {
      "id": "design",
      "command_name": "/shipmate design",
      "runtime_label": "Design seed workflow",
      "purpose": "Establish or extend a visible, reusable direction — adopt an existing app's system or plant a small seed, proven on a real screen.",
      "lead_roles": [
        "Pol",
        "Eye"
      ],
      "input_files": [
        "CLAUDE.md",
        "DECISIONS.md",
        "DESIGN.md",
        "design-model.yaml",
        "design/components.yaml",
        "design/taste.yaml"
      ],
      "output_files": [
        "DESIGN.md",
        "design-model.yaml",
        "design/components.yaml",
        "PDC.md",
        "generated themes + previews"
      ],
      "status_values": [
        "DONE",
        "DONE_WITH_CONCERNS",
        "BLOCKED",
        "NEEDS_CONTEXT"
      ],
      "handoff_text": "`DONE` — direction set (seeded or adopted) and rendered on a real screen.\\n`DONE_WITH_CONCERNS` — direction set; open questions listed for the founder.\\n`BLOCKED` — waiting on a founder decision about direction.\\n`NEEDS_CONTEXT` — need brand input or access to the existing app's code.",
      "next": [
        "plan",
        "build"
      ],
      "next_note": "whichever the request needs"
    },
    {
      "id": "plan",
      "command_name": "/shipmate plan",
      "runtime_label": "Planning workflow",
      "purpose": "Resolve implementation choices and meaningful risks, then a build order — light or full depth.",
      "lead_roles": [
        "Vi",
        "Arc",
        "Pol",
        "Adversarial"
      ],
      "input_files": [
        "CLAUDE.md",
        "DECISIONS.md",
        "LEARNINGS.md"
      ],
      "output_files": [
        "TASKS.md",
        "DECISIONS.md",
        "CONTEXT.md"
      ],
      "status_values": [
        "APPROVED",
        "NEEDS_REVISION",
        "BLOCKED"
      ],
      "handoff_text": "`APPROVED` — plan approved; the build order is in TASKS.md.\\n`NEEDS_REVISION` — revise the flagged sections and stress-test again.\\n`BLOCKED` — waiting on founder input. Name each open decision (DECISIONS.md, `Status: pending`) and the build items that can start without it.",
      "next": [
        "build"
      ],
      "next_note": "the first item in the build order"
    },
    {
      "id": "build",
      "command_name": "/shipmate build",
      "runtime_label": "Implementation workflow",
      "purpose": "Build one feature with the product's system and relevant expertise; verify the outcome with evidence.",
      "lead_roles": [
        "Dev"
      ],
      "input_files": [
        "CLAUDE.md",
        "TASKS.md",
        "DECISIONS.md",
        "design/components.yaml",
        "design/taste.yaml",
        "LEARNINGS.md"
      ],
      "output_files": [
        "code",
        "TASKS.md",
        "design/components.yaml",
        "design/taste.yaml"
      ],
      "status_values": [
        "DONE",
        "DONE_WITH_CONCERNS",
        "BLOCKED",
        "NEEDS_CONTEXT"
      ],
      "handoff_text": "`DONE` — feature done and verified.\\n`DONE_WITH_CONCERNS` — built, with the concerns said plainly to the founder.\\n`BLOCKED` — a concrete blocker needs founder input or missing infrastructure.\\n`NEEDS_CONTEXT` — more context is needed before a safe change.\\nReviewed before → the code changed since, so the last review is stale; say so.",
      "next": [
        "review"
      ],
      "next_note": "sized to the change, then the next build item"
    },
    {
      "id": "review",
      "command_name": "/shipmate review",
      "runtime_label": "Quality workflow",
      "purpose": "Verify the actual outcome with isolated reviewers sized to the change's risk, and record what was reviewed.",
      "lead_roles": [
        "Crit",
        "Pol",
        "Eye",
        "Test",
        "Adversarial"
      ],
      "input_files": [
        "CLAUDE.md",
        "DECISIONS.md",
        "LEARNINGS.md",
        "TASKS.md"
      ],
      "output_files": [
        "TASKS.md",
        "review findings",
        ".ship/reviews/<run>.json"
      ],
      "status_values": [
        "DONE",
        "DONE_WITH_CONCERNS",
        "BLOCKED",
        "NEEDS_CONTEXT"
      ],
      "handoff_text": "`DONE` — quality pass complete, nothing blocking.\\n`DONE_WITH_CONCERNS` — concerns added to TASKS.md.\\n`BLOCKED` — the review couldn't finish: a required environment, artifact or diff was missing.\\n`NEEDS_CONTEXT` — more context is needed to finish the review.",
      "next": [
        "launch"
      ],
      "next_note": "only when a release is intended and nothing blocks"
    },
    {
      "id": "launch",
      "command_name": "/shipmate launch",
      "runtime_label": "Release workflow",
      "purpose": "Verify delivery when a release is intended — fresh review, evidence-based gates, deploy, post-deploy check.",
      "lead_roles": [
        "Cap"
      ],
      "input_files": [
        "CLAUDE.md",
        "TASKS.md",
        "DECISIONS.md",
        ".ship/reviews/"
      ],
      "output_files": [
        "TASKS.md",
        "DECISIONS.md",
        "CONTEXT.md",
        "ship report"
      ],
      "status_values": [
        "DONE",
        "DONE_WITH_CONCERNS",
        "BLOCKED",
        "NEEDS_CONTEXT"
      ],
      "handoff_text": "`DONE` — live and verified; the measurement plan is filed.\\n`DONE_WITH_CONCERNS` — live, with the WARN rows and accepted risks listed.\\n`BLOCKED` — a FAIL gate or a stale review stands between you and release; the fix path is listed.\\n`NEEDS_CONTEXT` — need the deploy target, credentials, or a release decision.",
      "next": [
        "retro"
      ],
      "next_note": "when the measurement window closes"
    },
    {
      "id": "retro",
      "command_name": "/shipmate retro",
      "runtime_label": "Retrospective workflow",
      "purpose": "Preserve decisions, corrections, and lessons so the next cycle starts better.",
      "lead_roles": [
        "Retro"
      ],
      "input_files": [
        "TASKS.md",
        "DECISIONS.md",
        "design/taste.yaml",
        ".ship/reviews/",
        "git history"
      ],
      "output_files": [
        "CONTEXT.md",
        "LEARNINGS.md",
        "design/taste.yaml",
        "TASKS.md"
      ],
      "status_values": [
        "DONE",
        "DONE_WITH_CONCERNS",
        "BLOCKED",
        "NEEDS_CONTEXT"
      ],
      "handoff_text": "`DONE` — retro filed; decisions and corrections captured for next time.\\n`DONE_WITH_CONCERNS` — retro filed; inferences await the founder's confirmation.\\n`BLOCKED` — can't read history (not a git repo?).\\n`NEEDS_CONTEXT` — need measurement results the founder has.",
      "next": []
    }
  ],
